      - generic [ref=e230]:
        - heading "How I work" [level=3] [ref=e231]
        - paragraph [ref=e232]: I write each API as an OpenAPI contract before the code, so other teams can build in parallel. Every feature ships with JUnit and Mockito tests, a SonarQube check and an 80% coverage target, in Agile sprints. Day to day I use Java, Spring Boot, Spring for GraphQL, Spring Security, RabbitMQ, Kubernetes and AWS.
      - generic [ref=e233]:
