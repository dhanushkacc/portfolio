          - paragraph [ref=f2e101]: Security and performance, 2025–2026
          - paragraph [ref=f2e102]: "I hardened role-based access control across six or more microservices and fixed a flaw that could leak one user's session data into another request. Then I made authorization faster: permissions load in batches, sit in an in-memory Caffeine cache, and stay in sync across service instances through RabbitMQ."
