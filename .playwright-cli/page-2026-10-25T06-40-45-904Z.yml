      - img "Dhanushka Dilshan" [ref=f1e229]
      - generic [ref=f1e230]:
        - heading "How I work" [level=3] [ref=f1e231]
        - paragraph [ref=f1e232]: I write each API as an OpenAPI contract before the code, so other teams can build in parallel. Every feature ships with JUnit and Mockito tests, a SonarQube check and an 80% coverage target, in Agile sprints. Day to day I use Java, Spring Boot, Spring for GraphQL, Spring Security, RabbitMQ, Kubernetes and AWS.
      - generic [ref=f1e233]:
        - heading "How I got here" [level=3] [ref=f1e234]
        - paragraph [ref=f1e235]: I studied Computer Science at the University of Colombo School of Computing and joined X-Venture as an intern in November 2024. Six months later I joined full time, building XAPI.
