      - img "Dhanushka Dilshan" [ref=f4e235]
      - generic [ref=f4e236]:
        - heading "How I work" [level=3] [ref=f4e237]
        - paragraph [ref=f4e238]: I write each API as an OpenAPI contract before the code, so other teams can build in parallel. Every feature ships with JUnit and Mockito tests, a SonarQube check and an 80% coverage target, in Agile sprints. Day to day I use Java, Spring Boot, Spring for GraphQL, Spring Security, RabbitMQ, Kubernetes and AWS.
      - generic [ref=f4e239]:
        - heading "How I got here" [level=3] [ref=f4e240]
        - paragraph [ref=f4e241]: I studied Computer Science at the University of Colombo School of Computing and joined X-Venture as an intern in November 2024. Six months later I joined full time, building XAPI.
